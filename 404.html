<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <meta name="robots" content="noindex">
   <title>Page Not Found | Muhammad Aqib Javed</title>

   <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
   <link rel="icon" href="assets/img/favicon.png" type="image/png">
   <meta name="theme-color" content="#1B4FBD">

   <link rel="stylesheet" href="assets/css/styles.css">
   <link rel="stylesheet" href="assets/css/remixicon-subset.css">

   <style>
      .error404{
         min-height: 100vh;
         display: flex;
         flex-direction: column;
         align-items: center;
         justify-content: center;
         text-align: center;
         padding: 2rem 1.5rem;
      }
      .error404__code{
         font-family: var(--second-font);
         font-size: clamp(4rem, 18vw, 7rem);
         font-weight: var(--font-semi-bold);
         color: var(--first-color);
         line-height: 1;
      }
      .error404__title{
         font-size: var(--h1-font-size);
         color: var(--title-color);
         margin-block: .75rem 1rem;
      }
      .error404__text{
         color: var(--text-color);
         max-width: 26rem;
         margin-bottom: 2rem;
      }
   </style>
</head>
<body>
   <div class="error404">
      <div class="error404__code">404</div>
      <h1 class="error404__title">Page Not Found</h1>
      <p class="error404__text">The page you're looking for doesn't exist or has moved.</p>
      <a href="/" class="button">Back to Home <i class="ri-arrow-right-up-long-line"></i></a>
   </div>
</body>
</html>
